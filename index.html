<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Checker</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --mute:#8b93a7; --acc:#4f8cff; --up:#2ecc71; --down:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .search { display:flex; gap:8px; flex-wrap:wrap; }
  input, select, button { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
  input { flex:1; min-width:180px; }
  button.go { background:var(--acc); border-color:var(--acc); cursor:pointer; font-weight:600; }
  button:disabled { opacity:.6; cursor:wait; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:16px; }
  .head { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .head img { width:40px; height:40px; border-radius:50%; }
  .stats { display:flex; gap:20px; flex-wrap:wrap; margin-top:10px; color:var(--mute); font-size:14px; }
  .stats b { color:var(--text); }
  .up { color:var(--up); } .down { color:var(--down); }
  .links { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .links a { font-size:13px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; color:var(--acc); text-decoration:none; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; align-items:center; }
  .filters span { color:var(--mute); font-size:14px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; table-layout:fixed; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mute); font-weight:500; font-size:13px; }
  th.c-src { width:170px; } th.c-time { width:115px; }
  td.src { font-weight:600; font-size:14px; overflow-wrap:break-word; }
  td.time { color:var(--mute); font-size:13px; }
  td.body { overflow-wrap:anywhere; }
  .sub { color:var(--mute); font-weight:400; font-size:12px; }
  .badge { display:inline-block; margin-top:4px; font-size:11px; font-weight:500; padding:1px 8px; border-radius:999px; border:1px solid var(--line); color:var(--mute); }
  .g1 { color:#2ecc71; border-color:#2ecc7155; } .g2 { color:#b48cff; border-color:#b48cff55; }
  .g3 { color:#4f8cff; border-color:#4f8cff55; } .g4 { color:#8b93a7; }
  .ttl { font-weight:600; }
  .sum { margin-top:4px; color:#c9cedb; font-size:14px; }
  .orig { color:var(--mute); font-size:12px; margin-top:4px; font-weight:400; }
  .sumbtn { margin-top:6px; padding:2px 12px; font-size:12px; background:none; color:var(--acc); border:1px solid var(--line); border-radius:999px; cursor:pointer; }
  a { color:var(--acc); }
  .msg { color:var(--mute); padding:20px 0; }
  .warn { color:#f0b84b; font-size:13px; margin-top:8px; }
  @media (max-width:640px){ table { table-layout:auto; } th:nth-child(2), td.time { display:none; } th.c-src { width:110px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔎 Token Checker</h1>
  <form class="search" id="form">
    <input id="q" placeholder="Nhập mã token, ví dụ: WLD, BTC, SOL..." autocomplete="off" autofocus>
    <button class="go" id="btn" type="submit">Tìm</button>
  </form>

  <div id="info"></div>

  <div class="filters" id="filters" style="display:none">
    <span>Lọc:</span>
    <select id="fGroup"><option value="">Mọi loại nguồn</option></select>
    <select id="fSource"><option value="">Tất cả nguồn</option></select>
    <select id="fTime">
      <option value="0">Mọi thời gian</option>
      <option value="1">24 giờ qua</option>
      <option value="7">7 ngày qua</option>
      <option value="30">30 ngày qua</option>
      <option value="90">3 tháng qua</option>
      <option value="180">6 tháng qua</option>
      <option value="365">12 tháng qua</option>
    </select>
    <select id="fYear"><option value="">Mọi năm</option></select>
    <select id="fSort">
      <option value="new">Mới nhất trước</option>
      <option value="old">Cũ nhất trước</option>
    </select>
    <span id="count"></span>
    <span id="prog"></span>
  </div>

  <div id="result"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const TR = '/.netlify/functions/translate';
const SUM = '/.netlify/functions/summarize';
const GCLS = { 'Chính chủ dự án': 'g1', 'Cộng đồng': 'g2', 'Báo chí uy tín': 'g3', 'Dữ liệu thị trường': 'g4' };
let items = [];
let gen = 0;          // số thứ tự lần tìm hiện tại, để bỏ qua kết quả của lần tìm cũ
let coinName = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtUsd = n => n == null ? '—' : (n >= 1 ? n.toLocaleString('en-US',{maximumFractionDigits:2}) : n.toPrecision(3));
const fmtBig = n => n == null ? '—' : n >= 1e9 ? (n/1e9).toFixed(2)+' tỷ' : n >= 1e6 ? (n/1e6).toFixed(2)+' triệu' : n.toLocaleString('en-US');
const fmtTime = iso => iso ? new Date(iso).toLocaleString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:false}) : '—';

async function pool(tasks, n) {
  let k = 0;
  await Promise.all(Array.from({ length: n }, async () => { while (k < tasks.length) await tasks[k++](); }));
}
let drawTimer = null;
function schedule(myGen) {
  if (myGen !== gen || drawTimer) return;
  drawTimer = setTimeout(() => { drawTimer = null; draw(); updateProg(); }, 150);
}
function updateProg() {
  const n = items.filter(i => i.tPending || i.sPending || i.sumState === 'loading' || i.sumState === 'queued').length;
  $('prog').textContent = n ? `⏳ Còn ${n} mục đang dịch / tóm tắt...` : 'Hoàn tất';
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  const myGen = ++gen;
  $('btn').disabled = true;
  $('info').innerHTML = '';
  $('filters').style.display = 'none';
  $('prog').textContent = '';
  $('result').innerHTML = '<div class="msg">Đang thu thập thông tin từ các nguồn... (có thể mất 5–10 giây)</div>';
  try {
    const r = await fetch('/.netlify/functions/token?q=' + encodeURIComponent(q));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Lỗi không xác định');
    if (myGen !== gen) return;
    render(data);
    enrich(myGen);
  } catch (err) {
    $('result').innerHTML = '<div class="msg">Lỗi: ' + esc(err.message) + '</div>';
  } finally {
    $('btn').disabled = false;
  }
});

function render(d) {
  const c = d.coin;
  const ch = c.change24h;
  coinName = c.name;
  $('info').innerHTML = `
    <div class="card">
      <div class="head">
        ${c.image ? `<img src="${esc(c.image)}" alt="">` : ''}
        <div><b style="font-size:18px">${esc(c.name)}</b> <span style="color:var(--mute)">${esc(c.symbol)}</span></div>
      </div>
      <div class="stats">
        <div>Giá: <b>$${fmtUsd(c.price)}</b></div>
        <div>24h: <b class="${ch >= 0 ? 'up' : 'down'}">${ch == null ? '—' : ch.toFixed(2) + '%'}</b></div>
        <div>Vốn hóa: <b>$${fmtBig(c.marketCap)}</b></div>
        <div>Hạng: <b>${c.rank ?? '—'}</b></div>
        <div>Khối lượng 24h: <b>$${fmtBig(c.volume24h)}</b></div>
        <div>FDV: <b>$${fmtBig(c.fdv)}</b></div>
        <div>Đang lưu hành: <b>${fmtBig(c.circulating)}</b></div>
      </div>
      <div class="links">${c.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div>
      ${d.warnings.length ? `<div class="warn">⚠ ${d.warnings.map(esc).join(' · ')}</div>` : ''}
    </div>`;

  items = d.items.map((i, k) => ({
    ...i, id: k,
    titleVi: i.isVi ? i.title : '', titleTr: false,
    summaryVi: '',
    tPending: !i.isVi,          // tiêu đề chờ dịch
    sPending: !!i.summary,      // tóm tắt chờ dịch
    sumState: '',               // '', queued, loading, done, fail
  }));
  const opts = (arr, all) => `<option value="">${all}</option>` + arr.map(s => `<option>${esc(s)}</option>`).join('');
  $('fGroup').innerHTML = opts([...new Set(items.map(i => i.group))], 'Mọi loại nguồn');
  $('fSource').innerHTML = opts([...new Set(items.map(i => i.source))], 'Tất cả nguồn');
  const years = [...new Set(items.filter(i => i.time).map(i => new Date(i.time).getFullYear()))].sort((a, b) => b - a);
  $('fYear').innerHTML = opts(years, 'Mọi năm');
  $('filters').style.display = 'flex';
  draw();
  updateProg();
}

// Kết quả hiện ngay; dịch và tóm tắt chạy dần phía sau
async function enrich(myGen) {
  const tasks = [];
  items.forEach(i => {
    if (i.tPending) tasks.push({ item: i, field: 'title', text: i.title });
    if (i.sPending) tasks.push({ item: i, field: 'summary', text: i.summary });
  });
  const auto = items.filter(i => i.canFetch)
    .sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0)).slice(0, 20);
  auto.forEach(i => i.sumState = 'queued');
  schedule(myGen);
  await Promise.all([translate(tasks, myGen), summarizeItems(auto, myGen)]);
  schedule(myGen);
}

async function translate(tasks, myGen) {
  const chunks = [];
  for (let k = 0; k < tasks.length; k += 8) chunks.push(tasks.slice(k, k + 8));
  await pool(chunks.map(ch => async () => {
    let res = [];
    try {
      const r = await fetch(TR, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texts: ch.map(t => t.text) }) });
      res = (await r.json()).results || [];
    } catch {}
    ch.forEach((t, k) => {
      const r = res[k];
      if (t.field === 'title') { if (r) { t.item.titleVi = r.vi; t.item.titleTr = r.translated; } t.item.tPending = false; }
      else { if (r) t.item.summaryVi = r.vi; t.item.sPending = false; }
    });
    schedule(myGen);
  }), 5);
}

async function summarizeItems(list, myGen) {
  const chunks = [];
  for (let k = 0; k < list.length; k += 2) chunks.push(list.slice(k, k + 2));
  await pool(chunks.map(ch => async () => {
    ch.forEach(i => i.sumState = 'loading');
    schedule(myGen);
    let res = [];
    try {
      const r = await fetch(SUM, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: coinName, items: ch.map((i, k) => ({ id: k, url: i.url, title: i.title })) }) });
      res = (await r.json()).results || [];
    } catch {}
    const toTr = [];
    ch.forEach((i, k) => {
      const r = res.find(x => x.id === k);
      if (r && r.finalUrl) i.url = r.finalUrl;        // thay link Google News bằng link bài gốc
      if (r && r.ok && r.summary) {
        i.summary = r.summary; i.canFetch = false; i.sumState = 'done';
        if (r.isVi) i.summaryVi = r.summary;
        else { i.sPending = true; toTr.push({ item: i, field: 'summary', text: r.summary }); }
      } else i.sumState = 'fail';
    });
    schedule(myGen);
    if (toTr.length) await translate(toTr, myGen);
  }), 3);
}

// Bấm nút "Tóm tắt" ở từng mục
$('result').addEventListener('click', e => {
  const b = e.target.closest('[data-sum]');
  if (!b) return;
  const it = items[+b.dataset.sum];
  if (it && it.sumState !== 'loading') { it.sumState = 'queued'; summarizeItems([it], gen); }
});

function draw() {
  const grp = $('fGroup').value;
  const src = $('fSource').value;
  const days = +$('fTime').value;
  const yr = +$('fYear').value;
  const sort = $('fSort').value;
  const now = Date.now();
  let list = items.filter(i =>
    (!grp || i.group === grp) &&
    (!src || i.source === src) &&
    (!days || (i.time && now - new Date(i.time) <= days * 864e5)) &&
    (!yr || (i.time && new Date(i.time).getFullYear() === yr)));
  list.sort((a, b) => (new Date(b.time || 0) - new Date(a.time || 0)) * (sort === 'new' ? 1 : -1));
  $('count').textContent = list.length + ' mục';
  if (!list.length) { $('result').innerHTML = '<div class="msg">Không có thông tin phù hợp.</div>'; return; }
  $('result').innerHTML = `<table>
    <thead><tr><th class="c-src">Nguồn</th><th class="c-time">Thời gian</th><th>Nội dung (tiếng Việt)</th></tr></thead>
    <tbody>${list.map(i => {
      const sumTxt = i.summaryVi || i.summary;
      const busy = i.sumState === 'loading' || i.sumState === 'queued';
      return `<tr>
      <td class="src">${esc(i.source)}${i.sub ? ` <span class="sub">${esc(i.sub)}</span>` : ''}<br><span class="badge ${GCLS[i.group] || ''}">${esc(i.group)}</span></td>
      <td class="time">${fmtTime(i.time)}</td>
      <td class="body">
        <div class="ttl"${i.titleTr ? ` title="${esc('Gốc: ' + i.title)}"` : ''}>${esc(i.titleVi || i.title)}${i.tPending ? ' <span class="orig">⏳</span>' : ''}</div>
        ${sumTxt ? `<div class="sum">${esc(sumTxt)}${i.sPending ? ' <span class="orig">⏳</span>' : ''}</div>` : ''}
        ${busy ? `<div class="orig">⏳ Đang đọc và tóm tắt bài...</div>` : ''}
        ${i.sumState === 'fail' && !sumTxt ? `<div class="orig">Không đọc được nội dung bài (trang chặn truy cập tự động).</div>` : ''}
        ${i.canFetch && !sumTxt && !busy && i.sumState !== 'fail' ? `<button type="button" class="sumbtn" data-sum="${i.id}">Tóm tắt</button>` : ''}
        ${i.url ? `<div class="orig"><a href="${esc(i.url)}" target="_blank" rel="noopener">Xem nguồn ↗</a></div>` : ''}
      </td></tr>`;
    }).join('')}</tbody></table>`;
}

['fGroup', 'fSource', 'fTime', 'fYear', 'fSort'].forEach(id => $(id).addEventListener('change', draw));
</script>
</body>
</html>
